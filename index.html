<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manhwa System</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('manhwa-theme')
          const useLight = stored ? stored === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches
          document.documentElement.classList.toggle('dark', !useLight)
        } catch {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
